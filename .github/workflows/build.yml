name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo build (sccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sccache
            "%LOCALAPPDATA%\sccache"
            "~/.cache/sccache"
          key: ${{ runner.os }}-sccache-${{ matrix.os }}

      # ── Linux system deps (WebKitGTK for Tauri's webview) ───────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Node toolchain ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── Rust checks ─────────────────────────────────────────────────────
      - name: cargo build
        working-directory: src-tauri
        run: cargo build --verbose

      - name: cargo clippy (correctness gate)
        working-directory: src-tauri
        # The repository still carries non-correctness warning debt. Make
        # correctness findings release-blocking now; tighten to `-D warnings`
        # once the tracked warning backlog is cleared.
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose

      # cargo audit is a HARD gate, not advisory noise.
      #
      # It was previously `rustsec/audit-check` + `continue-on-error: true`,
      # which meant 19 known-and-unfixable warnings scrolled past on every run
      # and a genuinely new advisory would have looked exactly the same. The
      # exceptions are now codified with rationale and revisit dates in
      # src-tauri/.cargo/audit.toml, so this step can fail the build: that file
      # also sets `deny = ["warnings"]`, meaning ANY advisory not explicitly
      # justified there breaks CI.
      #
      # Run direct rather than via the action so the audit.toml exception list
      # is the single source of truth (the action carries its own ignore inputs
      # and does not read that file). Lockfile-only check, so one OS is enough.
      - name: cargo audit (gate — exceptions in src-tauri/.cargo/audit.toml)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit

      # ── Frontend build ──────────────────────────────────────────────────
      - name: Frontend build
        run: |
          npm run check
          npm run build
