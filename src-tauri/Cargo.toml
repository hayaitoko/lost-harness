[package]
name = "lost-harness-product"
version = "0.1.1"
description = "Lost Harness — Rust + Tauri 2 + Svelte 5 desktop app"
authors = ["Lukas Threlkeld"]
edition = "2021"
rust-version = "1.82"

# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "lost_harness_product_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
# App self-update (round-2 item 3). The official Tauri v2 updater: fetches the
# `latest.json` manifest + the signed `.app.tar.gz` from the app's PUBLIC GitHub
# releases, verifies the minisign signature against the `pubkey` in
# tauri.conf.json, then stages the install. `tauri-plugin-process` supplies the
# post-install relaunch. Both are driven from RUST ONLY — see `updater/mod.rs`
# for why (the launch check has to be gate-able and testable in `cargo test`,
# which a webview-side JS plugin call would bypass).
#
# Default features are `rustls-tls` + `zip`: rustls avoids adding a second TLS
# stack story on top of reqwest's, and `zip` is what unpacks the macOS
# `.app.tar.gz` payload. `native-tls` is deliberately NOT enabled.
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
# Version comparison for the update banner. Already in the lock tree (tauri's
# own build graph); promoted to a direct dep because `updater::is_strictly_newer`
# is the app's own second gate on top of the plugin's comparison — we never
# offer a same-or-older "update", whatever a manifest claims.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Semantic ("by meaning") memory search — the vec0 virtual table + KNN.
# Registered once at DB-open (see storage::ensure_sqlite_vec_registered).
# Bundled SQLite already provides FTS5 for the keyword lane.
sqlite-vec = "0.1.9"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = "0.1"
# C7: CancellationToken for cooperative message cancellation (already resolved
# transitively at 0.7.18 — this just promotes it to a direct dep).
tokio-util = "0.7"
# Used by storage + IPC (message_id generation, timestamps)
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"

# TRM (privacy classifier) + privacy gate deps
regex = "1"
url = "2"
# sha256 for the TRM message-hash audit log (spec §3: never log plaintext).
sha2 = "0.10"
# Ed25519 verification for the signed curated-model manifest (H-08 / P09):
# `models/hf_search.rs` uses VerifyingKey/Signature/Verifier to authenticate the
# manifest before any model may be labelled Curated. Default features only — no
# `pkcs8`, because the compiled-in public key is the raw 32 bytes in base64, not
# a PEM/DER blob. Production SIGNING is an offline human step (openssl), never
# done by the app; the test module uses SigningKey to sign throwaway fixtures.
ed25519-dalek = "2"
# Hex codec for the manifest `signature` field (the public key is base64 —
# `base64` below — and the file digests are hex-compared as strings).
hex = "0.4"
# Email round (stage 1): PKCE S256 code-challenge encoding (RFC 7636) + Gmail
# base64url message bodies / raw RFC 822 sends. sha2 above supplies the digest.
base64 = "0.22"

# M8 (Wave 5.3): hardware detection for the model-lifecycle onboarding — total
# RAM + CPU cores, to size the curated model catalog to the machine. Minimal
# feature set; builds on every OS + under --no-default-features.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

# Trained privacy classifier — the ONNX ensemble (bge-small + distilbert, INT8).
# Behind the default-on `onnx-classifier` feature so the base crate still builds
# if the ONNX Runtime native download is ever unavailable (e.g. a locked-down
# CI runner): `--no-default-features` drops back to the rules-only classifier.
# `ort` links ONNX Runtime; `tokenizers` loads the HF tokenizer.json (padding
# disabled at load — see engine.rs); `ndarray` builds the [batch, seq] tensors.
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.20", optional = true }
ndarray = { version = "0.16", optional = true }

# Unix-only: process-group kill (`libc::kill(-pgid, SIGKILL)`) for the guarded
# subprocess executor (item 7). POSIX-general, reused by a future Linux
# backend; the macOS Seatbelt wrapping lives above `tokio::process::Command`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Provider credentials live in the operating system's credential store. Pin to
# keyring 3.x because the crate's declared MSRV (1.75) matches this project's
# Rust 1.77 floor; keyring 4.x currently requires Rust 1.88.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
# Native pointer/scroll synthesis for the Accessibility-backed computer-use
# backend.  The crate is already transitive through Tauri; declaring it here
# makes the production backend's direct use explicit.
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# tauri::test::{mock_app, mock_builder, MockRuntime} — only used by the
# M1 agent-loop integration tests. Keeps the test-only symbol out of
# release builds.
tauri = { version = "2.11", features = ["test"] }
# tokio::time::{pause, advance} for the sidecar supervisor's backoff/idle
# tests (M8 S4) — virtual time, no real sleeping. Dev-only; features unify
# additively with the main dependency.
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["onnx-classifier", "local-runner", "computer-use"]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# The trained ONNX privacy classifier (bge-small + distilbert ensemble). Default
# on; disable with `--no-default-features` to build the rules-only fallback with
# no native ONNX Runtime dependency.
onnx-classifier = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
# The bundled llama.cpp sidecar (M8 S4): `models/runner.rs` — spawn/supervise
# `llama-server` from the vendored `vendor/llama-cpp` tree. No extra crates
# (tokio::process + reqwest are already deps); the feature exists so
# `--no-default-features` builds a core with no sidecar surface at all.
local-runner = []
# C6 / M5 logic half: the `ui_*` act-tool skeletons + OnScreenActionHook over
# the ComputerBackend seam. No new deps this slice (no native backend — the
# production registration uses the refuse-loudly UnavailableBackend); the
# feature exists NOW so the on-target native slice has a real switch to attach
# GUI deps to, and `--no-default-features` already excludes the whole surface.
computer-use = []
