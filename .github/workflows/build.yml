name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo build (sccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sccache
            "%LOCALAPPDATA%\sccache"
            "~/.cache/sccache"
          key: ${{ runner.os }}-sccache-${{ matrix.os }}

      # ── Linux system deps (WebKitGTK for Tauri's webview) ───────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Node toolchain ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── Rust checks (arm64-only — no x86_64 runtime files exist) ───────
      - name: cargo build (aarch64)
        working-directory: src-tauri
        run: cargo build --target aarch64-apple-darwin --verbose

      - name: cargo clippy (correctness gate, aarch64)
        working-directory: src-tauri
        # The repository still carries non-correctness warning debt. Make
        # correctness findings release-blocking now; tighten to `-D warnings`
        # once the tracked warning backlog is cleared.
        run: cargo clippy --target aarch64-apple-darwin --all-targets -- -D clippy::correctness

      - name: cargo test (aarch64)
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin --verbose

      - name: cargo audit (advisory)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      # ── Frontend build ──────────────────────────────────────────────────
      - name: Frontend build
        run: |
          npm run check
          npm run build
