name: build

on:
  push:
    branches: [main]
    # Round-2 item 3: a `vX.Y.Z` tag is what publishes an updatable release.
    # The `release` job at the bottom is gated on this and on `build` passing,
    # so a tag can never ship a bundle that failed the gates above it.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The `release` job raises this to `contents: write` for
# itself only — nothing else in this file may write to the repository.
permissions:
  contents: read

# Every `run:` below is POSIX shell. macOS runners default to bash already, but
# declaring it makes the contract explicit rather than inherited (L-03).
defaults:
  run:
    shell: bash

jobs:
  # Lost Harness is a macOS-only, Apple-Silicon-only desktop app:
  #   * the vendored llama.cpp runtime ships as arm64 Mach-O only
  #     (src-tauri/vendor/llama-cpp/macos-arm64/),
  #   * the computer-use backend is built on macOS Accessibility + CoreGraphics.
  # There is therefore no ubuntu/windows job: those runners could not run any of
  # the steps below (every cargo step is pinned to aarch64-apple-darwin), so
  # listing them in a matrix was a false support claim rather than a real gate.
  build:
    name: macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Runner sanity ────────────────────────────────────────────────────
      # macos-latest is Apple Silicon today. If GitHub ever repoints the label
      # at an Intel image, fail loudly here instead of silently producing an
      # x86_64 build that cannot load the vendored arm64 runtime.
      - name: Assert macOS arm64 runner
        run: |
          set -euo pipefail
          uname -sm
          test "$(uname -s)" = "Darwin" || { echo "::error::this workflow only runs on macOS"; exit 1; }
          test "$(uname -m)" = "arm64"  || { echo "::error::this workflow only runs on Apple Silicon (arm64)"; exit 1; }

      # ── Vendored runtime vs. documented minimum macOS (H-10 gate) ────────
      # README.md promises a minimum macOS version via a machine-readable
      # `MIN_MACOS=<x.y>` marker. Every vendored Mach-O file must declare
      # exactly that value in its LC_BUILD_VERSION `minos` field, and must be
      # arm64-only. If llama.cpp is re-vendored against a different deployment
      # target without updating the README (or vice versa), this step fails.
      - name: Vendored runtime matches documented minimum macOS
        run: |
          set -euo pipefail
          # `|| true`: with `set -o pipefail` a non-matching grep would abort
          # the step before the explanatory error below can be printed.
          expected="$( { grep -o 'MIN_MACOS=[0-9][0-9.]*' README.md || true; } | head -1 | cut -d= -f2)"
          if [ -z "${expected}" ]; then
            echo "::error file=README.md::missing machine-readable 'MIN_MACOS=<version>' marker"
            exit 1
          fi
          echo "README.md promises minimum macOS ${expected}"

          vendor_dir="src-tauri/vendor/llama-cpp/macos-arm64"
          status=0
          checked=0
          for f in "${vendor_dir}"/*; do
            case "${f}" in
              *.dylib|*/llama-server) ;;
              *) continue ;;
            esac
            checked=$((checked + 1))

            minos="$(otool -l "${f}" | awk '/LC_BUILD_VERSION/{seen=1} seen && /^ *minos /{print $2; exit}')"
            if [ -z "${minos}" ]; then
              echo "::error file=${f}::no LC_BUILD_VERSION load command found"
              status=1
            elif [ "${minos}" != "${expected}" ]; then
              echo "::error file=${f}::declares minos ${minos}, README promises ${expected}"
              status=1
            fi

            archs="$(lipo -archs "${f}")"
            if [ "${archs}" != "arm64" ]; then
              echo "::error file=${f}::expected arm64-only, found '${archs}'"
              status=1
            fi

            echo "  ${f}: minos=${minos:-none} archs=${archs}"
          done

          if [ "${checked}" -eq 0 ]; then
            echo "::error::no vendored Mach-O files found under ${vendor_dir}"
            exit 1
          fi
          echo "checked ${checked} vendored binaries"
          exit "${status}"

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Cache cargo build (sccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sccache
            ~/Library/Caches/Mozilla.sccache
          key: macos-arm64-sccache

      # ── Node toolchain ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── Rust checks (arm64-only — no x86_64 runtime files exist) ───────
      - name: cargo build (aarch64)
        working-directory: src-tauri
        run: cargo build --target aarch64-apple-darwin --verbose

      # Passable as of the campaign's single sanctioned whole-tree `cargo fmt`
      # commit; verified `cargo fmt --check` exits 0 on this tree.
      - name: cargo fmt (formatting gate)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy (correctness gate, aarch64)
        working-directory: src-tauri
        # The repository still carries non-correctness warning debt. Make
        # correctness findings release-blocking now; tighten to `-D warnings`
        # once the tracked warning backlog is cleared.
        run: cargo clippy --target aarch64-apple-darwin --all-targets -- -D clippy::correctness

      - name: cargo test (aarch64)
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin --verbose

      # cargo audit is a HARD gate, not advisory noise.
      #
      # It was previously `rustsec/audit-check` + `continue-on-error: true`,
      # which meant 19 known-and-unfixable warnings scrolled past on every run
      # and a genuinely new advisory would have looked exactly the same. The
      # exceptions are now codified with rationale and revisit dates in
      # src-tauri/.cargo/audit.toml, so this step can fail the build: that file
      # also sets `deny = ["warnings"]`, meaning ANY advisory not explicitly
      # justified there breaks CI.
      #
      # Run direct rather than via the action so the audit.toml exception list
      # is the single source of truth (the action carries its own ignore inputs
      # and does not read that file). Lockfile-only check, so one OS is enough.
      # NOTE: this step used to carry `if: matrix.os == 'ubuntu-latest'`, left over
      # from the pre-P17 three-OS matrix. P17 removed the matrix, so `matrix.os`
      # became an undefined context, the condition evaluated false, and this gate
      # SILENTLY NEVER RAN. Removed — the audit is lockfile-only, so running it on
      # the single macOS job is correct.
      - name: cargo audit (gate — exceptions in src-tauri/.cargo/audit.toml)
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version ^0.22
          cargo audit

      # ── Frontend build ──────────────────────────────────────────────────
      - name: Frontend check, test and build
        run: |
          npm run check
          npm test
          npm run build

      # npm audit is a real gate: the postcss advisory (GHSA-r28c-9q8g-f849) is
      # held at a fixed version by an `overrides` entry in package.json, so a
      # regression here means that pin was lost. Verified exit 0 on this tree.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  # ── Release (tag-triggered) ────────────────────────────────────────────────
  #
  # Round-2 item 3. Pushing `vX.Y.Z` builds the arm64 macOS bundle, signs the
  # updater payload with the minisign key held in Actions secrets, composes the
  # `latest.json` the shipped app fetches, and attaches both to a GitHub
  # Release. `src-tauri/tauri.conf.json`'s `version` is the source of truth —
  # the tag must agree with it or this job fails before building anything.
  #
  # `needs: build` is deliberate: a tag cannot publish a bundle whose tests,
  # clippy-correctness, fmt or audit gates did not pass.
  #
  # NOT done here, and worth knowing: the `.app` is not Apple-codesigned or
  # notarized (this repo has no Developer ID configured). The minisign
  # signature the updater verifies is a different thing entirely — it proves
  # the payload came from Lukas's key, not that Gatekeeper will accept a fresh
  # download. That gap is pre-existing and out of scope for this item.
  release:
    name: Release (macOS arm64)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert macOS arm64 runner
        run: |
          set -euo pipefail
          uname -sm
          test "$(uname -s)" = "Darwin" || { echo "::error::this workflow only runs on macOS"; exit 1; }
          test "$(uname -m)" = "arm64"  || { echo "::error::this workflow only runs on Apple Silicon (arm64)"; exit 1; }

      # The version the app reports, the version in the manifest and the tag
      # must be one value. A mismatch here would ship a release the running app
      # either ignores forever or re-offers on every launch.
      - name: Tag matches tauri.conf.json version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_v="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"
          echo "tag=${tag} tauri.conf.json=${conf} Cargo.toml=${cargo_v}"
          if [ "${tag}" != "${conf}" ]; then
            echo "::error::tag v${tag} does not match tauri.conf.json version ${conf}"
            exit 1
          fi
          if [ "${cargo_v}" != "${conf}" ]; then
            echo "::error::Cargo.toml version ${cargo_v} does not match tauri.conf.json ${conf} (get_app_version reads Cargo.toml)"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      # The updater refuses any payload whose signature doesn't verify against
      # the pubkey compiled into the app, so an unset signing secret would
      # produce a release nobody can install. Fail before spending the build.
      - name: Signing secrets are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository"
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set on this repository"
            exit 1
          fi
          echo "both signing secrets are set (values not printed)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # `createUpdaterArtifacts: true` in tauri.conf.json makes this emit
      # `<product>.app.tar.gz` and `<product>.app.tar.gz.sig` alongside the
      # .app/.dmg. The two env vars below are the ONLY place the private key is
      # used; it never lands on disk.
      - name: Build and sign the arm64 bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      # Compose `latest.json` by hand rather than reaching for a release action.
      # The shape is small and the updater's parser is strict about it
      # (tauri-plugin-updater's RemoteRelease: `version`, optional `notes`,
      # optional RFC-3339 `pub_date`, and a `platforms` map keyed by
      # `{os}-{arch}`), so writing it here keeps what ships reviewable.
      #
      # The asset is renamed to a space-free filename: GitHub rewrites spaces in
      # uploaded asset names, which would silently break the URL in the manifest.
      - name: Stage the updater artifacts
        id: stage
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"

          archive="$(ls "${bundle_dir}"/*.app.tar.gz 2>/dev/null | head -1 || true)"
          if [ -z "${archive}" ]; then
            echo "::error::no .app.tar.gz produced — is bundle.createUpdaterArtifacts still true?"
            ls -la "${bundle_dir}" || true
            exit 1
          fi
          if [ ! -f "${archive}.sig" ]; then
            echo "::error::${archive} has no .sig — the build did not sign the updater payload"
            exit 1
          fi

          mkdir -p dist-release
          asset="Lost-Harness_${version}_aarch64.app.tar.gz"
          cp "${archive}" "dist-release/${asset}"
          cp "${archive}.sig" "dist-release/${asset}.sig"

          signature="$(cat "dist-release/${asset}.sig")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${asset}"

          # `--arg` everywhere: the signature is base64 and the notes are free
          # text, neither of which may be interpolated into the jq program.
          jq -n \
            --arg version "${version}" \
            --arg notes "Lost Harness ${version}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "${url}" \
            --arg signature "${signature}" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "darwin-aarch64": { signature: $signature, url: $url }
               }
             }' > dist-release/latest.json

          echo "staged:"
          ls -la dist-release
          echo "manifest:"
          jq '.platforms["darwin-aarch64"].signature = "<redacted>"' dist-release/latest.json

      # ── The gate that decides whether this release is installable at all ──
      #
      # Everything above proves a signature was PRODUCED. It does not prove the
      # signature verifies against the public key compiled into the app, and
      # those are different facts: `TAURI_SIGNING_PRIVATE_KEY` is a repository
      # secret, `plugins.updater.pubkey` is a string in tauri.conf.json, and
      # nothing keeps them in step. Rotate the key, paste it into the wrong
      # secret, or update the config without re-signing, and every step above
      # still passes — while every installed copy of the app REFUSES the
      # release, silently, forever. That is the worst failure mode this feature
      # has, because it looks like success from here.
      #
      # So verify it, with the same minisign the updater implements, against
      # the pubkey the app actually ships rather than against the secret that
      # signed it.
      #
      # Formats (both are base64 wrappers, which is why the decode step exists):
      #   * `plugins.updater.pubkey` is base64 of a minisign `.pub` FILE
      #     (comment line + key line), not of the raw key bytes.
      #   * the emitted `.sig` is base64 of a minisign `.sig` FILE
      #     (untrusted comment, signature, trusted comment, global signature).
      - name: Signature verifies against the pubkey this build ships
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          asset="Lost-Harness_${version}_aarch64.app.tar.gz"

          brew list minisign >/dev/null 2>&1 || brew install minisign
          minisign -v

          node -e '
            const fs = require("fs");
            const conf = require("./src-tauri/tauri.conf.json");
            const pubkey = conf.plugins?.updater?.pubkey;
            if (!pubkey) throw new Error("plugins.updater.pubkey is missing from tauri.conf.json");
            fs.writeFileSync("verify.pub", Buffer.from(pubkey, "base64"));
            const sig = fs.readFileSync(process.argv[1], "utf8").trim();
            fs.writeFileSync("verify.sig", Buffer.from(sig, "base64"));
          ' "dist-release/${asset}.sig"

          # The key id, not the key material — both halves are public anyway,
          # and having it in the log is what makes a rotation mismatch legible.
          echo "shipped pubkey: $(head -1 verify.pub)"

          if ! minisign -V -m "dist-release/${asset}" -p verify.pub -x verify.sig; then
            echo "::error::the signed artifact does NOT verify against plugins.updater.pubkey in src-tauri/tauri.conf.json"
            echo "::error::every installed copy of the app would refuse this release. The signing key and the shipped pubkey have diverged — see docs/releasing.md (Rotating the signing key)."
            exit 1
          fi
          echo "verified: ${asset} is signed by the key this build trusts"
          rm -f verify.pub verify.sig

      # The runtime refuses any download URL that is not an asset of this
      # repository's releases (`updater::is_permitted_download_url`). The
      # manifest is composed by the step above, so a bad edit there would ship a
      # release the app declines to download — with a correct signature and a
      # correct version. Assert the two agree here, where it is cheap.
      - name: Manifest download URL is one the app will accept
        run: |
          set -euo pipefail
          url="$(jq -r '.platforms["darwin-aarch64"].url' dist-release/latest.json)"
          echo "manifest download url: ${url}"
          expected_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/"
          case "${url}" in
            "${expected_prefix}"*) ;;
            *)
              echo "::error::the manifest points the download at '${url}', which the app refuses; it must start with '${expected_prefix}'"
              exit 1
              ;;
          esac
          # Mirror of the Rust constant. If the repository is ever renamed, both
          # this and `updater::RELEASE_DOWNLOAD_PREFIX` have to move together.
          case "${url}" in
            https://github.com/hayaitoko/lost-harness/releases/download/*) ;;
            *)
              echo "::error::'${url}' does not match updater::RELEASE_DOWNLOAD_PREFIX in src-tauri/src/updater/mod.rs"
              exit 1
              ;;
          esac
          echo "the shipped app will accept this download URL"

      # Created as a DRAFT. Publishing is a human step — the moment a release
      # goes live, every installed copy of the app starts offering it.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" \
            --draft \
            --title "Lost Harness v${version}" \
            --notes "Signed arm64 macOS build. Attached: the updater payload, its minisign signature, and the latest.json the app fetches." \
            "dist-release/Lost-Harness_${version}_aarch64.app.tar.gz" \
            "dist-release/Lost-Harness_${version}_aarch64.app.tar.gz.sig" \
            "dist-release/latest.json"
          echo "Draft release v${version} created. Review it, then publish — the app only sees PUBLISHED releases."
